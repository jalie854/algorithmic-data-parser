[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algorithmic-data-parser"
version = "1.0.0"
description = "Streaming validation and sanitization for JSONL computational metrics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Project contributors" }]
dependencies = []

[project.scripts]
algorithmic-data-parser = "algorithmic_data_parser.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
